services:
  backend:
    build:
      context: ./ApiFunkos
      dockerfile: Dockerfile
    container_name: ApiFunkos
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Sqlite: "Data Source=/app/data/funkos.db"
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=funkos;Username=postgres;Password=postgres"
    command: [ "Production" ]
    depends_on:
      db:
        condition: service_healthy
        required: false
    volumes:
      - sqlite_data:/app/data

  db:
    image: postgres:16-alpine
    container_name: ApiFunkos_PostgreSQL
    profiles: [ "prod" ]
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: funkos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d funkos" ]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  sqlite_data:
  postgres_data: